name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Toolchain
        run: swiftc --version

      - name: Build app and CLI
        run: ./build.sh

      - name: Verify artifacts
        run: |
          test -d build/ClamshellBar.app
          codesign --verify --verbose=2 build/ClamshellBar.app
          ./build/clamshell doctor
          ls -lh build/ClamshellBar.zip build/clamshell

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ClamshellBar-${{ github.sha }}
          path: |
            build/ClamshellBar.zip
            build/clamshell

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/ClamshellBar.zip
            build/clamshell
          generate_release_notes: true
